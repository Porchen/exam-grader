</style></head>
<body><div id="app"></div>
<script>
const L='ABCDE',W=100,H=110,ROWS=10,$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={ex:[],v:'home',id:null,tab:'key',res:null,cam:null,msg:'',arm:null,mode:'grade',sv:null,detailId:null,lastScan:'',awaitRemoval:false,missing:0};
try{const saved=JSON.parse(localStorage.getItem('omr_exams')||'[]');if(Array.isArray(saved))S.ex=saved;else S.se=1}catch(e){S.se=1}
S.ex.forEach(ex=>{if(ex.t==='zg2'){ex.t='zg';ex.layoutVersion=0}if(ex.t==='std'||ex.t==='zg'&&ex.layoutVersion!==4){ex.sheets.forEach(t=>t.legacy=true)}});
const persist=()=>{try{localStorage.setItem('omr_exams',JSON.stringify(S.ex));S.se=0;return true}catch(e){S.se=1;return false}};
const warn=()=>S.se?'<p class="err">เบราว์เซอร์ไม่อนุญาตให้เก็บข้อมูลไว้ในเครื่อง โปรดเปิดในเบราว์เซอร์ปกติ</p>':'';
const keyN=ex=>ex.key.filter(k=>k>=0).length;
const full=ex=>ex.max>0?ex.max:keyN(ex)||1;
const fmt=n=>String(+(+n).toFixed(2));
const pts=(s,ex)=>s.tt?s.sc/s.tt*full(ex):0;
const cur=()=>S.ex.find(e=>e.id===S.id);
/* ตำแหน่งวงกลมบนกระดาษ (หน่วยกระดาษ 100x110) */
const pos=(q,c)=>[12.5+Math.floor(q/ROWS)*17.5+c*2.9,16+(q%ROWS)*8.6];

/* รูปแบบกระดาษ: app = พิมพ์จากแอป (A-E), std = กระดาษ 50 ข้อของครู (ก-ง) พิกัดวัดจากภาพกระดาษจริง */
const STDX=[[136,29],[320,28.7],[501,28.4]];
const SH={app:{mk:[[0,0],[100,0],[0,110],[100,110]],W:100,H:110,nc:5,lab:'ABCDE',rp:.65,ring:1.6,pos},
 std:{mk:[[0,0],[648.5,0],[0,443],[648.5,443],[0,885],[648.5,885],[256,121],[436.5,122.5],[256,488],[436.5,488],[256,850],[436.5,850]],W:648.5,H:885,nc:4,lab:'กขคง',rp:6,ring:15,pos:(q,c)=>{const g=Math.floor(q/10),r=q%10,X=STDX[[0,1,1,2,2][g]];return[X[0]+c*X[1]-33,(g%2?226+r*33.4:594+r*33.55)-75.5]}}};
const ZG={row1:165.5,rowStep:39.46,row1B:597.8,rowStepB:39.81,
 g:{BL:[110.5,33.5],TM:[323.5,33.3],BM:[321.9,33.85],TR:[534.0,33.4],BR:[534.9,33.02]}};
const zgPos=(q,c)=>{
 let g,row,y;
 if(q<10){g='BL';row=q;y=ZG.row1B+row*ZG.rowStepB}
 else if(q<20){g='TM';row=q-10;y=ZG.row1+row*ZG.rowStep}
 else if(q<30){g='BM';row=q-20;y=ZG.row1B+row*ZG.rowStepB}
 else if(q<40){g='TR';row=q-30;y=ZG.row1+row*ZG.rowStep}
 else{g='BR';row=q-40;y=ZG.row1B+row*ZG.rowStepB}
 const[x0,p]=ZG.g[g];return[x0+c*p-(g==='BL'?4+1.3*row:0),y];
};
SH.zg={mk:[[0,0],[745.5,3],[-14,502.5],[740.5,515.5],[-33.5,1035.5],[754.5,1034],[291,129],[501,135.5],[287.5,563],[497,564.5]],W:745.5,H:1035.5,nc:5,lab:'ABCDE',rp:6,ring:15,pos:zgPos};
const shp=ex=>SH[ex.t||'app'];
/* ---------- กระดาษคำตอบ ---------- */
function sheetSVG(ex){
 let s=`<svg viewBox="-6 -6 112 122" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block" font-family="Sarabun,sans-serif" fill="#000">`;
 [[0,0],[W,0],[0,H],[W,H]].forEach(([x,y])=>s+=`<rect x="${x-2.5}" y="${y-2.5}" width="5" height="5"/>`);
 s+=`<text x="6" y="5" font-size="3">${esc(ex.name)}</text><text x="6" y="10" font-size="2.4">ชื่อ-สกุล ............................................. เลขที่ ......</text>`;
 for(let q=0;q<ex.n;q++){
  const y=pos(q,0)[1],col=Math.floor(q/ROWS);
  if(q%ROWS==0)for(let c=0;c<5;c++)s+=`<text x="${pos(q,c)[0]}" y="13.4" font-size="1.8" text-anchor="middle">${L[c]}</text>`;
  s+=`<text x="${10.8+col*17.5}" y="${y+.8}" font-size="2.2" text-anchor="end">${q+1}</text>`;
  for(let c=0;c<5;c++){const[x,yy]=pos(q,c);s+=`<circle cx="${x}" cy="${yy}" r="1.1" fill="#fff" stroke="#000" stroke-width=".25"/>`}
 }
 return s+'</svg>';
}

/* ---------- สแกน (OMR) ---------- */
function homog(src,dst){
 const s1=Math.max(...src.flat().map(Math.abs))||1,s2=Math.max(...dst.flat().map(Math.abs))||1,R=[];
 for(let i=0;i<src.length;i++){const x=src[i][0]/s1,y=src[i][1]/s1,u=dst[i][0]/s2,v=dst[i][1]/s2;R.push([x,y,1,0,0,0,-x*u,-y*u,u]);R.push([0,0,0,x,y,1,-x*v,-y*v,v])}
 let A=R;
 if(R.length>8){A=Array.from({length:8},()=>Array(9).fill(0));for(const r of R)for(let i=0;i<8;i++){for(let j=0;j<8;j++)A[i][j]+=r[i]*r[j];A[i][8]+=r[i]*r[8]}}
 for(let i=0;i<8;i++){
  let m=i;for(let r=i+1;r<8;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;
  [A[i],A[m]]=[A[m],A[i]];if(!Number.isFinite(A[i][i])||Math.abs(A[i][i])<1e-12)throw Error('ไม่สามารถจับแนวกระดาษได้');
  for(let r=0;r<8;r++)if(r!=i){const f=A[r][i]/A[i][i];for(let c=i;c<9;c++)A[r][c]-=f*A[i][c]}
 }
 const h=A.map((r,i)=>r[8]/r[i]),k=s2/s1;
 return[h[0]*k,h[1]*k,h[2]*s2,h[3]*k,h[4]*k,h[5]*s2,h[6]/s1,h[7]/s1];
}
const ap=(h,x,y)=>{const d=h[6]*x+h[7]*y+1;return[(h[0]*x+h[1]*y+h[2])/d,(h[3]*x+h[4]*y+h[5])/d]};

function analyze(src,sw,sh,ex,md=1100){
 const P=shp(ex);
 const k=Math.min(1,md/Math.max(sw,sh)),w=Math.round(sw*k),h=Math.round(sh*k);
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;
 const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(src,0,0,w,h);
 const d=cx.getImageData(0,0,w,h).data,N=w*h,g=new Uint8Array(N),hist=new Array(256).fill(0);
 for(let i=0;i<N;i++){const v=(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11)|0;g[i]=v;hist[v]++}
 /* Otsu */
 let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];
 let sB=0,wB=0,best=0,t=100;
 for(let i=0;i<256;i++){wB+=hist[i];if(!wB)continue;const wF=N-wB;if(!wF)break;sB+=i*hist[i];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)**2;if(v>best){best=v;t=i}}
 t=Math.min(t,140);
 /* หาสี่เหลี่ยมดำ (เครื่องหมายมุม) */
 const mn=Math.max(6,Math.min(w,h)*.012),mx=Math.min(w,h)*.15;
 const seen=new Uint8Array(N),st=new Int32Array(N),cand=[];
 for(let p=0;p<N;p++){
  if(seen[p]||g[p]>=t)continue;
  let sp=0,x0=w,x1=0,y0=h,y1=0,a=0;st[sp++]=p;seen[p]=1;
  while(sp){
   const q=st[--sp],x=q%w,y=(q/w)|0;a++;
   if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
   if(x>0&&!seen[q-1]&&g[q-1]<t){seen[q-1]=1;st[sp++]=q-1}
   if(x<w-1&&!seen[q+1]&&g[q+1]<t){seen[q+1]=1;st[sp++]=q+1}
   if(y>0&&!seen[q-w]&&g[q-w]<t){seen[q-w]=1;st[sp++]=q-w}
   if(y<h-1&&!seen[q+w]&&g[q+w]<t){seen[q+w]=1;st[sp++]=q+w}
  }
  const bw=x1-x0+1,bh=y1-y0+1;
  if(bw>mn&&bw<mx&&bh>mn&&bh<mx&&bw/bh>.6&&bw/bh<1.6&&a/(bw*bh)>.8)cand.push([(x0+x1)/2,(y0+y1)/2]);
 }
 const cn=cand.map(p=>[p[0]/w,p[1]/h]);
 const bad={err:'ไม่พบสี่เหลี่ยมดำที่มุมกระดาษครบ 4 จุด ลองถ่ายให้เห็นมุมทั้งสี่ชัดเจน แสงสม่ำเสมอ และไม่มีเงาบัง',found:cand.length,cands:cn};
 if(cand.length<4)return bad;
 const dd=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
 const top=(f,n)=>[...cand].sort((a,b)=>f(b)-f(a)).slice(0,n);
 const CA=top(p=>-(p[0]+p[1]),2),CB=top(p=>p[0]-p[1],2),CC=top(p=>p[0]+p[1],2),CD=top(p=>p[1]-p[0],2);
 const SC=[[0,0],[P.W,0],[P.W,P.H],[0,P.H]],rx=P.W/P.H,std=P.mk.length>4;
 const match=(hm,tol)=>{const pr=[],used=new Set();
  P.mk.forEach(m=>{const q=ap(hm,m[0],m[1]);let bi=-1,bd=tol;cand.forEach((c,i)=>{const d=dd(c,q);if(d<bd&&!used.has(i)){bd=d;bi=i}});if(bi>=0){used.add(bi);pr.push([m,cand[bi]])}});
  return pr};
 /* ลองทุกทิศทางของกระดาษ (หมุนได้ 4 ทิศ) เลือกแบบที่เครื่องหมายบนกระดาษตรงที่สุด */
 let bq=null;const bk=[0,0,0,0];
 for(const a of CA)for(const b of CB)for(const c of CC)for(const d of CD){
  const Q=[a,b,c,d];if(new Set(Q).size<4)continue;
  for(let k=0;k<4;k++){
   const I=SC.map((_,i)=>Q[(i+k)%4]),ra=dd(I[0],I[1])/dd(I[0],I[3]);
   if(ra<rx*.6||ra>rx*1.6)continue;
   let hm;try{hm=homog(SC,I)}catch(e){continue}
   const pr=match(hm,dd(I[0],I[1])*.025);
   bk[k]=Math.max(bk[k],pr.length);
   if(!bq||pr.length>bq.pr.length)bq={pr,I,hm,ra,k};
  }
 }
 if(!bq)return bad;
 if(std){const other=Math.max(...bk.filter((_,i)=>i!==bq.k));
  if(bq.pr.length<Math.max(4,Math.ceil(P.mk.length*.8))||bq.pr.length<=other)return{...bad,err:'อ่านทิศทางกระดาษไม่ได้ ลองถอยออกเล็กน้อยหรือเพิ่มแสงให้เห็นมุมกระดาษชัดขึ้น'}}
 let hm=bq.hm,pr=bq.pr;
 for(let it=0;it<2&&pr.length>=6;it++){
  const h2=homog(pr.map(x=>x[0]),pr.map(x=>x[1])),p2=match(h2,dd(bq.I[0],bq.I[1])*.02);
  if(p2.length>=pr.length-1){hm=h2;pr=p2}else break;
 }
 if(pr.length>=8){const err=pr.reduce((total,[m,c])=>total+dd(ap(hm,...m),c),0)/pr.length;if(err>dd(bq.I[0],bq.I[1])*.012)return {...bad,err:'แนวกระดาษคลาดเคลื่อน โปรดถ่ายใหม่ให้เห็นเครื่องหมายทุกจุดชัดเจน'}}
 const quad=[ap(hm,0,0),ap(hm,P.W,0),ap(hm,P.W,P.H),ap(hm,0,P.H)].map(p=>[p[0]/w,p[1]/h]);
 const p0=ap(hm,P.W/2,P.H/2),p1=ap(hm,P.W/2+1,P.H/2),u=Math.hypot(p1[0]-p0[0],p1[1]-p0[1]),rp=Math.max(2,u*P.rp);
 const mean=(x,y)=>{let s=0,n=0;const r=Math.ceil(rp);
  for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++)if(i*i+j*j<=rp*rp){const X=Math.round(x+i),Y=Math.round(y+j);if(X>=0&&Y>=0&&X<w&&Y<h){s+=g[Y*w+X];n++}}
  return n?s/n:255};
 /* อ่านคำตอบ: วงที่เข้มกว่าค่ากลางของแถวมากพอ = ถูกระบาย */
 const ans=[],uncertain=[];
 for(let q=0;q<ex.n;q++){
  const m=Array.from({length:P.nc},(_,c)=>mean(...ap(hm,...P.pos(q,c))));
  const med=[...m].sort((a,b)=>a-b)[2],on=[];
  m.forEach((v,c)=>{if(med-v>45)on.push(c)});
  if(on.length!==1||med-Math.min(...m)<65)uncertain.push(q+1);
  ans.push(on.length==1?on[0]:on.length?-2:-1);   /* -1 ว่าง, -2 ระบายซ้ำ */
 }
 let sc=0,tt=0;ex.key.forEach((kk,q)=>{if(kk>=0){tt++;if(ans[q]===kk)sc++}});
 /* ภาพเฉพาะส่วนหัวที่นักเรียนเขียนชื่อ: แก้เอียงตามเครื่องหมายบนกระดาษ */
 const head=document.createElement('canvas');head.width=650;head.height=136;
 const hd=head.getContext('2d'),pixels=hd.createImageData(head.width,head.height),hi=pixels.data;
 for(let yy=0;yy<head.height;yy++)for(let xx=0;xx<head.width;xx++){

function drawOv(r){
 const v=$('#vid'),c=$('#ov');if(!c||!v||!v.clientWidth)return;
 const W=c.width=v.clientWidth,H=c.height=v.clientHeight,x=c.getContext('2d'),P=shp(cur()),sa=P.W/P.H,scale=Math.min(W/(v.videoWidth||W),H/(v.videoHeight||H)),rw=(v.videoWidth||W)*scale,rh=(v.videoHeight||H)*scale,ox=(W-rw)/2,oy=(H-rh)/2;

 const review=flagged.length?`<div class="card reviewbox"><h2>รอตรวจทานข้อ ${flagged.join(', ')}</h2><p>คะแนนที่แสดงยังเป็นผลอ่านอัตโนมัติ โปรดเทียบภาพเต็มกับกระดาษจริง แล้วเลือกคำตอบของข้อที่อ่านไม่ชัด</p>${flagged.map(q=>`<label class="reviewrow">ข้อ ${q}<select class="reviewAnswer" data-q="${q-1}"><option value="-1" ${t.ans[q-1]===-1?'selected':''}>ไม่ได้ตอบ</option><option value="-2" ${t.ans[q-1]===-2?'selected':''}>ระบายมากกว่า 1 ช่อง</option>${lab.map((l,c)=>`<option value="${c}" ${t.ans[q-1]===c?'selected':''}>${l}</option>`).join('')}</select></label>`).join('')}<label><input id="paperChecked" type="checkbox" style="display:inline;width:auto"> ตรวจเทียบกระดาษจริงแล้ว</label><button class="b" data-a="confirmreview">ยืนยันผลที่ตรวจทาน</button></div>`:t.review?'<p class="card err">ผลนี้รอตรวจทาน โปรดเทียบภาพกับกระดาษจริง</p>':t.reviewedAt?'<p class="ok">ตรวจทานกับกระดาษจริงแล้ว · วงสีบนภาพแสดงผลอ่านครั้งแรก</p>':'';
 return `<button class="g" data-a="backresults">กลับไปผลคะแนน</button>${nav}<h2>${esc(t.name)} · ${t.legacy?'ต้องตรวจใหม่':fmt(pts(t,ex))+'/'+fmt(full(ex))+' คะแนน'}${t.review?' (รอตรวจทาน)':''}</h2><p class="mut">${new Date(t.t).toLocaleString('th-TH')} · ถูก ${t.sc}/${t.tt} ข้อ · ${fmt(t.sc/(t.tt||1)*100)}%</p><img class="headphoto" style="width:100%;height:auto;max-height:180px" data-thumb="${t.id}" alt="หัวกระดาษคำตอบที่มีชื่อผู้สอบ">${!t.legacy?sameNotice(ex,t.ans,t):''}<div id="savedImage">กำลังโหลดภาพที่บันทึก...</div>${review}<h2>คำตอบรายข้อ</h2><div class="detailgrid">${(t.ans||[]).map((a,i)=>`<div class="card" style="margin:0">ข้อ ${i+1}: ${a===-1?'ว่าง':a===-2?'ซ้ำ':lab[a]||'–'}<br><small>เฉลย ${lab[ex.key[i]]||'–'}</small></div>`).join('')}</div>${nav}`;
};
async function refreshHead(ex,t){
 const original=await imageOp('get',t.id);if(!original)return null;
 const url=URL.createObjectURL(original),img=new Image();
 try{
  await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('เปิดภาพเดิมไม่ได้'));img.src=url});
  const result=analyze(img,img.naturalWidth,img.naturalHeight,ex,1100);
  if(result.err)return null;
  const blob=await jpeg(result.head);await imageOp('put',t.id+'-head',blob);
  t.headVersion=2;persist();return blob;
 }finally{URL.revokeObjectURL(url)}
}
async function showThumbnails(){const ex=cur();for(const el of document.querySelectorAll('[data-thumb]')){
 try{const t=ex.sheets.find(x=>x.id===el.dataset.thumb);let blob=await imageOp('get',el.dataset.thumb+'-head');
  if(t&&t.headVersion!==2&&ex.t==='zg')blob=await refreshHead(ex,t)||blob;
  if(!el.isConnected)continue;
  if(!blob){el.replaceWith(document.createTextNode('ภาพหัวกระดาษไม่มีในผลเดิม'));continue}
  const url=URL.createObjectURL(blob);el.onload=()=>URL.revokeObjectURL(url);el.onerror=()=>URL.revokeObjectURL(url);el.src=url;
 }catch(e){el.alt='เปิดภาพหัวกระดาษไม่ได้'}}}
async function showStorage(){const el=$('#storageInfo');if(!el)return;const bytes=S.ex.flatMap(e=>e.sheets).reduce((n,x)=>n+(x.imageBytes||0),0);let estimate='';try{const q=await navigator.storage.estimate();estimate=q.quota?' · เบราว์เซอร์จัดสรรพื้นที่ประมาณ '+fmt(q.quota/1048576)+' MB':''}catch(e){}if(el.isConnected)el.textContent='ภาพที่แอปบันทึกประมาณ '+fmt(bytes/1048576)+' MB'+estimate+' (พื้นที่จริงขึ้นกับมือถือและเบราว์เซอร์)'}
async function showSavedImage(id){const slot=$('#savedImage');if(!slot)return;try{const blob=await imageOp('get',id);if(!slot.isConnected)return;if(!blob){slot.textContent='ผลคะแนนเดิมไม่มีภาพสแกนที่บันทึกไว้';return}const url=URL.createObjectURL(blob),img=document.createElement('img');img.className='scanphoto';img.alt='ภาพกระดาษคำตอบที่สแกนพร้อมวงตรวจ';img.onload=()=>URL.revokeObjectURL(url);img.onerror=()=>URL.revokeObjectURL(url);img.src=url;slot.replaceChildren(img)}catch(e){slot.textContent='เปิดภาพที่บันทึกไม่ได้: '+e.message}}

const examV=ex=>`<div class="np"><button class="g" data-a="home">กลับ</button>${ex.t=='app'?'<button class="g" data-a="sheet">พิมพ์กระดาษคำตอบ</button>':''}<button class="g" data-a="dex">${S.arm==='ex'?'ยืนยันลบชุดนี้':'ลบชุดข้อสอบ'}</button></div>
 ${warn()}<h1>${esc(ex.name)}</h1>
 <div class="fs"><span class="mut">คะแนนเต็ม</span><input id="mx" type="number" min="1" step="any" inputmode="decimal" value="${ex.max||''}" placeholder="${keyN(ex)||''}">${[10,15,20,30].map(n=>`<button class="g" style="padding:4px 10px;margin:0" data-a="max" data-v="${n}">${n}</button>`).join('')}<button class="g" style="padding:4px 10px;margin:0" data-a="max" data-v="">1 ข้อ = 1 คะแนน</button></div>
 <small class="mut">แปลงคะแนนจากข้อที่ถูก ตามจำนวนเฉลย (${keyN(ex)} ข้อ) เป็นคะแนนเต็มที่ตั้งไว้ เปลี่ยนแล้วคะแนนที่บันทึกไว้จะแปลงใหม่ให้อัตโนมัติ</small>
 <div class="tabs">${[['key','เฉลย'],['scan','สแกน'],['res','ผลคะแนน']].map(([t,l])=>`<button class="${S.tab==t?'on':''}" data-a="tab" data-v="${t}">${l}${t=='res'?` (${ex.sheets.length})`:''}</button>`).join('')}</div>`+
 (S.tab=='key'?keyV(ex):S.tab=='scan'?scanV(ex):S.detailId?detailV(ex):resV(ex));

const sheetV=ex=>`<div class="np"><button class="g" data-a="back">กลับ</button><button class="b" data-a="print">พิมพ์</button>
 <p class="mut">พิมพ์บนกระดาษ A4 ที่ขนาด 100% (ไม่ย่อ/ขยายอัตโนมัติ) ให้นักเรียนระบายวงกลมให้เต็มด้วยดินสอหรือปากกาสีเข้ม ห้ามตัดสี่เหลี่ยมดำที่มุมออก</p></div><div class="sheet">${sheetSVG(ex)}</div>`;

function render(){
 const y=scrollY,ex=cur();
 const h=S.cam&&S.mode==='grade'&&S.v==='exam'&&S.tab==='scan'?scanV(ex):S.v==='sheet'&&ex?sheetV(ex):S.v==='exam'&&ex?examV(ex):homeV();
 $('#app').innerHTML=(S.cam||S.reviewLive)&&S.mode==='grade'&&S.tab==='scan'?h:'<main>'+h+'</main>';
 if(S.cam){const v=$('#vid');if(v){v.srcObject=S.cam;v.play().catch(()=>{})}}
 if(S.res&&$('#out'))$('#out').appendChild(S.res.cv);if(S.detailId&&S.tab==='res')showSavedImage(S.detailId);if(S.tab==='res'){showThumbnails();showStorage()}
 if(S.cam||S.reviewLive||S.jumpTop){scrollTo(0,0);S.jumpTop=false}else scrollTo(0,y);
}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,v=b.dataset.v,ex=cur();
 if(a!=='dsc'&&a!=='dex')S.arm=null;
 if(a=='open'){const x=S.ex.find(z=>z.id==v);stopCam();S.mode='grade';S.id=v;S.v='exam';S.tab=x.key.some(k=>k>=0)?'scan':'key';S.res=null;S.msg='';S.sv=null;S.detailId=null}
 else if(a=='home'){stopCam();S.v='home';S.res=null;S.msg='';S.sv=null;S.detailId=null}
 else if(a=='tab'){stopCam();S.tab=v;S.detailId=null;S.res=null;S.msg='';S.sv=null}
 else if(a=='new'){const q=+$('#nq').value,x={id:Date.now().toString(36),layoutVersion:4,name:$('#nn').value.trim()||'ข้อสอบใหม่',t:$('#nt').value,n:q,key:Array(q).fill(-1),sheets:[]};
  S.ex.unshift(x);persist();S.id=x.id;S.v='exam';S.tab='key'}
 else if(a=='verifykey'){if(keyN(ex)!==ex.n){alert('เฉลยยังไม่ครบ');return}ex.layoutVersion=4;persist()}
 else if(a=='key'){if(ex.sheets.some(s=>!s.legacy)){alert('มีผลคะแนนแล้ว กรุณาสร้างชุดข้อสอบใหม่หากต้องการแก้เฉลย');return}const q=+b.dataset.q,c=+b.dataset.c;ex.key[q]=ex.key[q]===c?-1:c;persist()}
 else if(a=='sheet')S.v='sheet';
 else if(a=='back')S.v='exam';
 else if(a=='print'){window.print();return}
 else if(a=='live'){if(S.mode!=='key'&&(ex.t==='std'||keyN(ex)!==ex.n||ex.t==='zg'&&ex.layoutVersion!==4)){alert('กรุณาตรวจเฉลยให้ครบก่อนสแกน');return}startCam();return}
 else if(a=='nextscan'){S.res=null;S.sv=null;S.reviewLive=false;startCam();return}
 else if(a=='zoomscan'){const out=$('#out');if(out)out.classList.toggle('zoomed');return}
 else if(a=='snap'){return}
 else if(a=='stop'){stopCam();S.reviewLive=false;S.res=null;S.tab='res';S.detailId=null;S.msg=''}
 else if(a=='mode'){S.mode=v;S.res=null;S.msg='';S.sv=null}
 else if(a=='scankey'){S.mode='key';S.tab='scan';S.res=null;S.msg=''}
 else if(a=='usekey'){if(ex.sheets.some(s=>!s.legacy)){alert('มีผลคะแนนแล้ว กรุณาสร้างชุดข้อสอบใหม่หากต้องการแก้เฉลย');return}if(S.res.ans.some(a=>a<0)){alert('อ่านเฉลยไม่ครบ กรุณาถ่ายใหม่หรือเติมเฉลยด้วยมือ');return}ex.key=S.res.ans.map(a=>a>=0?a:-1);persist();stopCam();S.res=null;S.msg='';S.tab='key'}
 else if(a=='redo'){S.res=null;S.sv=null;S.msg=''}
 else if(a=='detail'){S.reviewLive=false;S.tab='res';S.detailId=v;S.res=null}
 else if(a=='detailstep'){const i=ex.sheets.findIndex(t=>t.id===S.detailId),next=i+Number(v);if(i<0||next<0||next>=ex.sheets.length)return;S.detailId=ex.sheets[next].id;S.jumpTop=true}
 else if(a=='confirmreview'){
  const t=ex.sheets.find(x=>x.id===S.detailId),choices=[...document.querySelectorAll('.reviewAnswer')];
  if(!t||!t.review||!choices.length)return;
  if(!$('#paperChecked')?.checked){alert('กรุณาตรวจเทียบกระดาษจริงก่อนยืนยันคะแนน');return}
  const before={ans:[...t.ans],sc:t.sc,tt:t.tt,review:t.review,reviewedAt:t.reviewedAt,rawAns:t.rawAns};
  if(!t.rawAns)t.rawAns=[...t.ans];
  choices.forEach(c=>{t.ans[+c.dataset.q]=+c.value});
  t.tt=keyN(ex);t.sc=ex.key.reduce((n,k,q)=>n+(k>=0&&t.ans[q]===k?1:0),0);
  t.review=false;t.reviewedAt=Date.now();
  if(!persist()){Object.assign(t,before);alert('บันทึกผลที่ตรวจทานไม่ได้ กรุณาลองอีกครั้ง');return}
 }
 else if(a=='backresults'){S.detailId=null}
 else if(a=='delsv'){return}
 else if(a=='max'){ex.max=v?+v:null;persist()}
 else if(a=='dsc'){if(S.arm===v){ex.sheets=ex.sheets.filter(s=>s.id!==v);persist();imageOp('delete',v).catch(()=>{});imageOp('delete',v+'-head').catch(()=>{});S.arm=null;S.detailId=null}else S.arm=v}
 else if(a=='dex'){if(S.arm==='ex'){S.ex=S.ex.filter(x=>x!==ex);persist();ex.sheets.forEach(t=>{imageOp('delete',t.id).catch(()=>{});imageOp('delete',t.id+'-head').catch(()=>{})});S.v='home';S.arm=null}else S.arm='ex'}
 else if(a=='backup'){(async()=>{try{const images={};for(const x of S.ex)for(const sheet of x.sheets){const blob=await imageOp('get',sheet.id);if(blob)images[sheet.id]=await asData(blob);const head=await imageOp('get',sheet.id+'-head');if(head)images[sheet.id+'-head']=await asData(head)}const url=URL.createObjectURL(new Blob([JSON.stringify({format:'omr-backup',version:2,ex:S.ex,images})],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='สำรองข้อมูลตรวจข้อสอบพร้อมภาพ.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(err){alert('สำรองข้อมูลไม่ได้: '+err.message)}})();return}
 else if(a=='csv'){
  const rows=ex.sheets.filter(s=>!s.legacy).map(s=>`"${s.name.replace(/^[=+@\-\t\r]/,x=>"'"+x).replace(/"/g,'""')}",${s.sc},${s.tt},${fmt(pts(s,ex))},${fmt(full(ex))},${(s.sc/(s.tt||1)*100).toFixed(1)},${s.review?'รอตรวจทาน':s.reviewedAt?'ตรวจทานแล้ว':'อ่านอัตโนมัติ'}`).join('\n');
  const t='ชื่อ,ข้อที่ถูก,จำนวนเฉลย,คะแนน,คะแนนเต็ม,เปอร์เซ็นต์,สถานะ\n'+rows;
  const url=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}));
  const link=document.createElement('a');link.href=url;link.download=(ex.name||'คะแนนข้อสอบ')+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return
 }
 render();
});
document.addEventListener('change',e=>{
 const t=e.target,ex=cur();
 if(t.id==='restore'&&t.files[0]){(async()=>{try{const data=JSON.parse(await t.files[0].text());if(data.format!=='omr-backup'||!Array.isArray(data.ex)||data.ex.some(x=>!Number.isInteger(x.n)||x.n<1||x.n>50||!Array.isArray(x.key)||x.key.length!==x.n||!Array.isArray(x.sheets)||!['zg','zg2','std','app'].includes(x.t)))throw Error('รูปแบบไฟล์ไม่ถูกต้อง');const ids=new Set(S.ex.map(x=>x.id)),added=[];for(const x of data.ex){const y=structuredClone(x);if(y.t==='zg2'){y.t='zg';y.layoutVersion=0}if(y.t==='std'||y.t==='zg'&&y.layoutVersion!==4)y.sheets.forEach(t=>t.legacy=true);if(ids.has(y.id))y.id=Date.now().toString(36)+Math.random().toString(36).slice(2);ids.add(y.id);for(const sheet of y.sheets){const old=sheet.id;sheet.id=Date.now().toString(36)+Math.random().toString(36).slice(2,10);if(data.images?.[old]){await imageOp('put',sheet.id,await fromData(data.images[old]));added.push(sheet.id)}if(data.images?.[old+'-head']){await imageOp('put',sheet.id+'-head',await fromData(data.images[old+'-head']));added.push(sheet.id+'-head')}}S.ex.push(y)}if(!persist())throw Error('พื้นที่เก็บข้อมูลไม่พอ');S.msg='นำเข้าข้อมูลแล้ว';render()}catch(err){alert('นำเข้าข้อมูลไม่ได้: '+err.message)}})();return}
 if(t.id==='fi'&&t.files[0]){const im=new Image();im.onload=async()=>{process(im,im.naturalWidth,im.naturalHeight,false);if(S.res&&S.mode==='grade'){try{S.sv=await autosave(cur(),S.res);S.msg='บันทึกภาพและคะแนนแล้ว'}catch(err){S.res=null;S.msg='บันทึกภาพและคะแนนไม่ได้: '+err.message}}render();URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(t.files[0])}
 else if(t.id==='mx'&&ex){ex.max=+t.value>0?+t.value:null;persist();render()}
 });
if(!S.se)persist();
render();
</script></body></html>
